  <div class="divider"></div>
  <div class="panel">
    <div class="panel-num">· 01 ·</div>
    <img src="images/vol28_panel01.jpg" alt="灰色西装人站在门外">
    <div class="panel-caption">深夜，气象站门外。他站在台阶上，两只手插兜，头微微低着，<br>姿势和别的灰色西装人一模一样——只有脚在抖。他不敢推门。</div>
  </div>
  <div class="panel">
    <div class="panel-num">· 02 ·</div>
    <img src="images/vol28_panel02.jpg" alt="阿缝递出一杯热茶">
    <div class="panel-caption">阿缝半开着门，没说话，只是把一杯热茶递出去。<br>他接过去，手抖得茶水洒在裤子上，也没擦。</div>
  </div>
  <div class="panel">
    <div class="panel-num">· 03 ·</div>
    <img src="images/vol28_panel03.jpg" alt="靠在门框上喝茶">
    <div class="panel-caption">他靠在门框上喝茶，声音很小：我好像记得小时候有个奶奶，<br>但她叫什么名字，我想不起来了。阿缝站在旁边，只是看着他。</div>
