<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜班气象站 · 第 1 册</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: #F7F0DD;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(27,42,73,0.03) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(245,197,99,0.04) 0%, transparent 50%);
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    min-height: 100vh;
    padding: 0;
    color: #1B2A49;
  }
  .wrapper {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  .cover {
    text-align: center;
    padding: 40px 0 24px;
  }
  .cover .series-title {
    font-size: 14px;
    letter-spacing: 8px;
    color: #7A7D82;
    margin-bottom: 12px;
  }
  .cover .title {
    font-size: 42px;
    font-weight: 700;
    color: #1B2A49;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .cover .subtitle {
    font-size: 16px;
    color: #B89968;
    letter-spacing: 4px;
    margin-bottom: 28px;
  }
  .cover .meta {
    font-size: 13px;
    color: #7A7D82;
    letter-spacing: 2px;
  }
  .divider {
    width: 60px;
    height: 1px;
    background: #B89968;
    margin: 32px auto;
    position: relative;
  }
  .divider::before {
    content: '';
    position: absolute;
    top: -2px; left: 50%;
    width: 5px; height: 5px;
    background: #B89968;
    border-radius: 50%;
    transform: translateX(-50%);
  }
  .panel {
    margin-bottom: 40px;
    position: relative;
  }
  .panel-num {
    font-size: 12px;
    letter-spacing: 4px;
    color: #B89968;
    text-align: center;
    margin-bottom: 16px;
  }
  .panel img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(27,42,73,0.08);
    filter: saturate(1.02);
  }
  .panel-caption {
    font-size: 13px;
    color: #7A7D82;
    text-align: center;
    margin-top: 12px;
    letter-spacing: 1px;
    line-height: 1.8;
    padding: 0 12px;
  }
  .foot {
    text-align: center;
    padding: 40px 0;
    color: #7A7D82;
    font-size: 12px;
    letter-spacing: 3px;
    line-height: 2;
  }
  .foot hr {
    border: none;
    border-top: 1px dashed #B89968;
    margin: 0 auto 24px;
    width: 80px;
  }
  /* 手机适配 */
  @media (max-width: 480px) {
    .wrapper { padding: 24px 12px 60px; }
    .cover .title { font-size: 32px; letter-spacing: 3px; }
    .cover .subtitle { font-size: 14px; }
    .panel { margin-bottom: 28px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- 封面 -->
  <div class="cover">
    <div class="series-title">ORIGINAL MANHUA · 原创漫画</div>
    <h1 class="title">夜班气象站</h1>
    <div class="subtitle">第 1 册 · 起</div>
    <div class="meta">针脚缝的不是云 · 是城市的记忆</div>
  </div>

  <div class="divider"></div>

  <!-- Panel 1 -->
  <div class="panel">
    <div class="panel-num">· 01 ·</div>
    <img src="images/vol01_panel01.jpg" alt="气象站全貌">
    <div class="panel-caption">这是气象站。只有夜里能看见。<br>老房子浮在云上面，云有针脚。</div>
  </div>

  <!-- Panel 2 -->
  <div class="panel">
    <div class="panel-num">· 02 ·</div>
    <img src="images/vol01_panel02.jpg" alt="阿缝缝漏雨云">
    <div class="panel-caption">学徒阿缝踩缝纫机，补一片漏雨的云。<br>针脚不能错三次，错三次云归你养。</div>
  </div>

  <!-- Panel 3 -->
  <div class="panel">
    <div class="panel-num">· 03 ·</div>
    <img src="images/vol01_panel03.jpg" alt="白噪音现身">
    <div class="panel-caption">阿缝缝完抬头，远处有一片云。<br>太整齐了。没有针脚。这不是人类缝的。</div>
  </div>

  <div class="divider"></div>

  <div class="foot">
    <hr>
    原创 IP · 暂不对外授权<br>
    3 / 80 册 · 第 1 轮样稿<br>
    2026.11
  </div>

</div>
</body>
</html>
